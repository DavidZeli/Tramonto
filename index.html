    document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
    window.scrollTo(0, 0);
  }

    hideAll();
    document.getElementById('screen-lang').style.display = 'block';
  }

  function goHome() {
    hideAll();
    document.getElementById('screen-home').style.display = 'block';
  }

  function applyRules(text, list) {
    let out = String(text);
    list.forEach(([pattern, replacement]) => {
      out = out.replace(pattern, replacement);
    });
    return out.replace(/\s+/g, ' ').trim();
  }

    if (lang === 'sr') return title;
    return (categoryExact[lang] && categoryExact[lang][title]) ? categoryExact[lang][title] : title;

    document.getElementById('back-cats').innerText = ui[l].backMenu;
    document.getElementById('cats-title').innerText = ui[l].catsTitle;
    document.getElementById('cat-search').placeholder = ui[l].catsSearch;
    document.getElementById('item-search').placeholder = ui[l].itemsSearch;

    if (document.getElementById('screen-cats').style.display === 'block') renderCategories();
    if (document.getElementById('screen-items').style.display === 'block') {
      const cat = data[currentCategoryKey];
      document.getElementById('items-title').innerText = cat ? translateCategoryTitle(cat.title.sr) : '';
      renderItems();
    }

    goHome();
  }

  function callReservation(){ window.location.href = 'tel:+381365101414'; }
  function openReview(){ window.open('https://www.google.com/search?q=restoran+kos+kraljevo+ocene', '_blank'); }

  function initials(text){
    const parts = String(text).trim().split(/\s+/).filter(Boolean);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  function svgThumb(label){
    const safe = String(label || 'KOŠ')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const i = initials(label || 'Koš');
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b2a1d"/>
            <stop offset="100%" stop-color="#120e0b"/>
          </linearGradient>
          <radialGradient id="r" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#f0d7a1" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#d4b06a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="220" height="220" rx="28" fill="url(#g)"/>
        <rect x="14" y="14" width="192" height="192" rx="24" fill="none" stroke="rgba(212,176,106,.22)"/>
        <circle cx="110" cy="86" r="42" fill="url(#r)"/>
        <path d="M110 58c-17 14-27 32-27 47 0 18 13 32 27 32s27-14 27-32c0-15-10-33-27-47zm0 63c-10 0-18-9-18-18 0-10 7-20 18-29 11 9 18 19 18 29 0 9-8 18-18 18z" fill="#d4b06a" opacity=".9"/>
        <text x="110" y="170" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#f6efe6" letter-spacing="2">${safe}</text>
        <text x="110" y="192" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" fill="#d4b06a" letter-spacing="2">${i}</text>
      </svg>`;
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function showCategories(){
    hideAll();
    document.getElementById('screen-cats').style.display='block';
    renderCategories();
  }

  function renderCategories(){
    const box = document.getElementById('cats-box');
    const q = (document.getElementById('cat-search')?.value || '').toLowerCase().trim();
    let html = '';

    order.forEach(key => {
      const cat = data[key];
      const title = translateCategoryTitle(cat.title[lang] || cat.title.sr);
      if(q && !title.toLowerCase().includes(q)) return;

      html += `<button class="btn" onclick="showItems('${key}')"><div class="txt"><b>${title}</b><span>${ui[lang].view}</span></div><div class="icon">→</div></button>`;
    });

    box.innerHTML = html;
  }

  function showItems(key){
    currentCategoryKey = key;
    hideAll();
    const cat = data[key];
    document.getElementById('items-title').innerText = translateCategoryTitle(cat.title[lang] || cat.title.sr);
    document.getElementById('item-search').value = '';
    document.getElementById('screen-items').style.display='block';
    renderItems();
  }

  function renderItems(){
    const box = document.getElementById('items-box');
    const q = (document.getElementById('item-search')?.value || '').toLowerCase().trim();
    const cat = data[currentCategoryKey];
    let html = '';

    if(!cat || !cat.items){
      box.innerHTML = '';
      return;
    }

    cat.items.forEach(item => {
      const raw = normalizeDisplayText(item.n);
      const name = translateItemName(raw);
      const searchBlob = `${raw} ${name} ${item.p}`.toLowerCase();
      if(q && !searchBlob.includes(q)) return;

      html += `
        <div class="item">
          <img class="thumb" src="${svgThumb(name)}" alt="${name}">
          <div class="info"><h4>${name}</h4></div>
          <div class="price">${item.p}<span>RSD</span></div>
        </div>`;
    });

    box.innerHTML = html || `<div style="color:#b9afa3; text-align:center; padding:24px 10px;">${ui[lang].noResults}</div>`;
  }

  function filterCategories(){ renderCategories(); }
  function filterItems(){ renderItems(); }

  document.getElementById('home-sub').innerText = ui.sr.home;
  document.getElementById('menu-t').innerText = ui.sr.menu;
  document.getElementById('menu-s').innerText = ui.sr.menuSub;
  document.getElementById('res-t').innerText = ui.sr.res;
  document.getElementById('res-s').innerText = ui.sr.resSub;
  document.getElementById('rev-t').innerText = ui.sr.rev;
  document.getElementById('rev-s').innerText = ui.sr.revSub;
  document.getElementById('back-lang').innerText = ui.sr.backLang;
  document.getElementById('back-home').innerText = ui.sr.backHome;
  document.getElementById('back-cats').innerText = ui.sr.backMenu;
  document.getElementById('cats-title').innerText = ui.sr.catsTitle;
  document.getElementById('cat-search').placeholder = ui.sr.catsSearch;
  document.getElementById('item-search').placeholder = ui.sr.itemsSearch;
</script>
