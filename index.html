<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stari Koš | Premium Digitalni meni</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#d4b06a;
      --gold-2:#f0d7a1;
      --bg:#0e0b09;
      --panel:rgba(22,17,14,.72);
      --panel-2:rgba(34,25,19,.78);
      --panel-3:rgba(15,12,10,.82);
      --line:rgba(212,176,106,.16);
      --text:#f6efe6;
      --muted:#b9afa3;
      --shadow:0 18px 50px rgba(0,0,0,.38);
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%}
    body{
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      font-family:'Montserrat',sans-serif;
      background:
        linear-gradient(rgba(8,6,5,.78), rgba(8,6,5,.88)),
        url('https://images.unsplash.com/photo-1521017432531-fbd92d768814?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at top left, rgba(212,176,106,.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(255,255,255,.05), transparent 30%),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
      background-size:auto, auto, 42px 42px, 42px 42px;
      opacity:.8;
    }

    .container{
      width:100%; max-width:540px; margin:0 auto;
      padding:18px 18px 130px; position:relative; z-index:1;
    }

    .screen{display:none; animation:fadeIn .45s ease}
    @keyframes fadeIn{from{opacity:0; transform:translateY(10px); filter:blur(5px)} to{opacity:1; transform:translateY(0); filter:blur(0)}}

    h1,h2,h3{font-family:'Playfair Display',serif; font-style:italic; letter-spacing:.3px}

    .hero{
      text-align:center;
      padding:18px 18px 14px;
      margin-top:22px;
    }
    .hero .line{
      width:96px; height:1px; margin:0 auto 18px;
      background:linear-gradient(90deg, transparent, rgba(212,176,106,.9), transparent);
    }
    .hero h1{
      font-size:46px; line-height:1.03;
      color:var(--gold-2);
      text-shadow:0 10px 28px rgba(0,0,0,.42);
    }
    .hero p{
      margin-top:10px;
      font-size:11px; text-transform:uppercase; letter-spacing:5px;
      color:var(--muted);
    }

    .panel{
      background:linear-gradient(180deg, rgba(37,27,19,.72), rgba(15,12,10,.84));
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow:hidden;
    }
    .panel-pad{padding:22px}

    .btn{
      width:100%;
      border:none;
      border-radius:22px;
      padding:18px 20px;
      margin-bottom:14px;
      background:linear-gradient(180deg, rgba(45,34,25,.82), rgba(22,17,13,.9));
      color:var(--text);
      display:flex; align-items:center; justify-content:space-between;
      cursor:pointer;
      transition:.25s ease;
      box-shadow:var(--shadow);
      border:1px solid rgba(212,176,106,.14);
    }
    .btn:hover{transform:translateY(-2px); border-color:rgba(212,176,106,.42); background:linear-gradient(180deg, rgba(58,42,29,.92), rgba(25,19,14,.94))}
    .btn:active{transform:scale(.98)}
    .btn .txt{display:flex; flex-direction:column; text-align:left}
    .btn .txt b{font-size:17px; font-weight:600; margin-bottom:4px; letter-spacing:.4px}
    .btn .txt span{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted)}
    .btn .icon{color:var(--gold); font-size:20px; margin-left:10px}

    #btn-review{
      background:linear-gradient(180deg, rgba(49,35,24,.84), rgba(24,18,14,.94));
      border-color:rgba(212,176,106,.32);
    }
    #btn-review .icon, #btn-review .txt b{color:var(--gold-2)}

    .cat-title{
      text-align:center;
      font-size:32px;
      color:var(--gold-2);
      margin:12px 0 24px;
    }

    .item{
      display:flex;
      gap:14px;
      align-items:center;
      padding:14px 0;
      border-bottom:1px solid rgba(255,255,255,.07);
    }
    .thumb{
      width:72px; height:72px; flex:0 0 72px;
      border-radius:18px;
      object-fit:cover;
      border:1px solid rgba(212,176,106,.18);
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      background:#221913;
    }
    .info{flex:1; min-width:0}
    .info h4{font-size:16px; line-height:1.2; font-weight:500; margin-bottom:4px}
    .info p{font-size:11px; line-height:1.35; color:var(--muted)}
    .price{font-weight:700; font-size:16px; white-space:nowrap; color:var(--gold-2)}
    .price span{display:block; font-size:9px; letter-spacing:1px; color:var(--gold)}

    .lang-grid{display:grid; grid-template-columns:1fr; gap:10px}

    .back-fixed{
      position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
      z-index:100;
      border:none;
      padding:12px 30px;
      border-radius:999px;
      background:linear-gradient(180deg, #e4c785, #c99d4e);
      color:#16110c;
      font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:1px;
      box-shadow:0 14px 28px rgba(212,176,106,.28);
      cursor:pointer;
    }

    .footer{
      text-align:center;
      margin-top:42px;
      padding-bottom:10px;
    }
    .footer .small{font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase}
    .footer .brand{font-size:11px; color:var(--gold); letter-spacing:1px; margin-top:6px}

    .lang-top{
      text-align:center;
      margin-top:84px;
    }
    .lang-top h2{font-size:32px; color:var(--text)}
    .lang-top p{color:var(--muted); margin-bottom:28px}

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .section-head .mini{
      color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:2px;
    }

    .search-wrap{
      margin:12px 0 18px;
      position:relative;
    }
    .search-wrap input{
      width:100%;
      padding:15px 18px;
      border-radius:18px;
      border:1px solid rgba(212,176,106,.16);
      outline:none;
      background:rgba(13,10,8,.55);
      color:var(--text);
      font-family:inherit;
      box-shadow:var(--shadow);
    }
    .search-wrap input::placeholder{color:#9d927f}

    @media (max-width:420px){
      .hero h1{font-size:38px}
      .cat-title{font-size:28px}
      .btn .txt b{font-size:16px}
    }
  </style>
</head>

        <h2>Stari Koš</h2>
        <p>Luksuz, tradicija i ukus</p>

        <div class="lang-grid">
          <button class="btn" onclick="setLang('sr')"><div class="txt"><b>Srpski</b><span>Izaberi jezik</span></div><div class="icon">→</div></button>
          <button class="btn" onclick="setLang('en')"><div class="txt"><b>English</b><span>Choose language</span></div><div class="icon">→</div></button>
          <button class="btn" onclick="setLang('ru')"><div class="txt"><b>Русский</b><span>Выберите язык</span></div><div class="icon">→</div></button>
        </div>
      </div>
    </div>

    <div id="screen-home" class="screen">

        <div class="line"></div>
        <h1>Stari Koš</h1>
        <p id="home-sub">Tradicija ukusa</p>
      </div>

      <button class="btn" onclick="showCategories()"><div class="txt"><b id="menu-t">Meni</b><span id="menu-s">Hrana i piće</span></div><div class="icon">→</div></button>
      <button class="btn" onclick="callReservation()"><div class="txt"><b id="res-t">Rezervacije</b><span id="res-s">Pozovite nas</span></div><div class="icon">☏</div></button>
      <button class="btn" id="btn-review" onclick="openReview()"><div class="txt"><b id="rev-t">Oceni nas</b><span id="rev-s">Google recenzije</span></div><div class="icon">★</div></button>

      <div class="footer">
        <div class="small">Premium digital menu</div>
        <div class="brand">Created by David Želi</div>
      </div>

      <button class="back-fixed" id="back-lang" onclick="showLang()">Jezik</button>
    </div>

    <div id="screen-cats" class="screen">
      <div class="section-head">
        <h2 class="cat-title" id="cats-title">Meni</h2>
      </div>
      <div class="search-wrap"><input id="cat-search" type="text" placeholder="Pretraži kategorije..." oninput="filterCategories()"></div>
      <div id="cats-box"></div>
      <button class="back-fixed" id="back-home" onclick="goHome()">Nazad</button>
    </div>

    <div id="screen-items" class="screen">
      <div class="section-head">
        <h2 class="cat-title" id="items-title"></h2>
      </div>

      <div id="items-box"></div>
      <button class="back-fixed" id="back-cats" onclick="showCategories()">Meni</button>
    </div>
  </div>

    function initials(text){
      const parts = String(text).trim().split(/\s+/).filter(Boolean);
      if(parts.length === 1) return parts[0].slice(0,2);
      return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    }

    function svgThumb(label){
      const safe = String(label || 'KOŠ')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const i = initials(label || 'Koš');
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b2a1d"/>
              <stop offset="100%" stop-color="#120e0b"/>
            </linearGradient>
            <radialGradient id="r" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#f0d7a1" stop-opacity=".25"/>
              <stop offset="100%" stop-color="#d4b06a" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="220" height="220" rx="28" fill="url(#g)"/>
          <rect x="14" y="14" width="192" height="192" rx="24" fill="none" stroke="rgba(212,176,106,.22)"/>
          <circle cx="110" cy="86" r="42" fill="url(#r)"/>
          <path d="M110 58c-17 14-27 32-27 47 0 18 13 32 27 32s27-14 27-32c0-15-10-33-27-47zm0 63c-10 0-18-9-18-18 0-10 7-20 18-29 11 9 18 19 18 29 0 9-8 18-18 18z" fill="#d4b06a" opacity=".9"/>
          <text x="110" y="170" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" fill="#f6efe6" letter-spacing="2">${safe}</text>
          <text x="110" y="192" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" fill="#d4b06a" letter-spacing="2">${i}</text>
        </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function showCategories(){
      hideAll();
      document.getElementById('screen-cats').style.display='block';
      renderCategories();
    }

    function renderCategories(){
      const box = document.getElementById('cats-box');
      const q = (document.getElementById('cat-search')?.value || '').toLowerCase().trim();
      let html = '';
      order.forEach(key => {
        const cat = data[key];
        const title = cat.title[lang] || cat.title.sr;
        if(q && !title.toLowerCase().includes(q)) return;
        html += `<button class="btn" onclick="showItems('${key}')"><div class="txt"><b>${title}</b><span>${ui[lang].view}</span></div><div class="icon">→</div></button>`;
      });
      box.innerHTML = html;
    }

    function showItems(key){
      currentCategoryKey = key;
      hideAll();
      const cat = data[key];
      document.getElementById('items-title').innerText = cat.title[lang] || cat.title.sr;
      document.getElementById('item-search').value = '';
      document.getElementById('screen-items').style.display='block';
      renderItems();
    }

    function renderItems(){
      const box = document.getElementById('items-box');
      const q = (document.getElementById('item-search')?.value || '').toLowerCase().trim();
      const cat = data[currentCategoryKey];
      let html = '';
      cat.items.forEach(item => {
        if(q && !String(item.n).toLowerCase().includes(q) && !String(item.p).toLowerCase().includes(q)) return;
        html += `
          <div class="item">
            <img class="thumb" src="${svgThumb(item.n)}" alt="${item.n}">
            <div class="info"><h4>${item.n}</h4></div>
            <div class="price">${item.p}<span>RSD</span></div>
          </div>`;
      });
      box.innerHTML = html || '<div style="color:#b9afa3; text-align:center; padding:24px 10px;">Nema rezultata</div>';
    }
