<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restoran Koš — Luksuzni digitalni meni</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #d8b27a;
            --primary-soft: rgba(216, 178, 122, 0.18);
            --primary-strong: #f0d1a0;
            --dark: #120f0d;
            --darker: #090807;
            --card: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.08);
            --text: #f7f2ea;
            --text-soft: rgba(247, 242, 234, 0.85);
            --text-muted: rgba(247, 242, 234, 0.58);
            --border: rgba(216, 178, 122, 0.18);
            --border-strong: rgba(216, 178, 122, 0.34);
            --shadow: 0 20px 55px rgba(0, 0, 0, 0.52);
            --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.24);
            --radius: 22px;
            --pill: 999px;
            --transition: 0.28s cubic-bezier(.2,.8,.2,1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            background:
                linear-gradient(180deg, rgba(4,3,3,0.70), rgba(4,3,3,0.92)),
                radial-gradient(circle at 50% 18%, rgba(216,178,122,0.16), transparent 30%),
                url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1800&auto=format&fit=crop');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 12%, rgba(216,178,122,0.12), transparent 22%),
                radial-gradient(circle at 82% 18%, rgba(255,255,255,0.06), transparent 16%),
                radial-gradient(circle at 50% 85%, rgba(0,0,0,0.30), transparent 34%);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 52px 52px;
            opacity: 0.12;
            mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            min-height: 100vh;
            padding: 18px 16px 120px;
            position: relative;
            z-index: 1;
        }

        .screen {
            display: none;
            animation: fadeUp 0.42s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .hero-card {
            background:
                linear-gradient(145deg, rgba(255,255,255,0.115), rgba(255,255,255,0.025)),
                rgba(10, 8, 6, 0.58);
            border: 1px solid rgba(240, 209, 160, 0.24);
            border-radius: 32px;
            padding: 24px 20px 20px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.62),
                inset 0 1px 0 rgba(255,255,255,0.10),
                inset 0 -1px 0 rgba(216,178,122,0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 31px;
            background:
                radial-gradient(circle at 22% 0%, rgba(240,209,160,0.16), transparent 34%),
                linear-gradient(120deg, transparent, rgba(255,255,255,0.055), transparent);
            pointer-events: none;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: clamp(44px, 8vw, 68px);
            letter-spacing: 0.5px;
            font-weight: 500;
            text-shadow: 0 16px 40px rgba(0,0,0,0.78);
            margin-top: 2px;
            line-height: .92;
            position: relative;
            z-index: 1;
            text-transform: none;
            font-style: normal;
        }

        .hero-title span {
            color: var(--primary);
        }

        .hero-subtitle {
            font-family: 'DM Sans', sans-serif;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3.2px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 16px 0;
            opacity: 0.75;
            position: relative;
            z-index: 1;
        }

        .ornament span {
            width: 54px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(216,178,122,.95), transparent);
        }

        .ornament i {
            color: var(--primary);
            font-size: 8px;
            text-shadow: 0 0 12px rgba(216,178,122,.35);
        }

        .luxury-btn {
            width: 100%;
            padding: 19px 20px;
            margin-bottom: 14px;
            border-radius: 24px;
            border: 1px solid rgba(240, 209, 160, 0.30);
            background:
                linear-gradient(135deg, rgba(255,255,255,0.135), rgba(255,255,255,0.035)),
                rgba(10, 8, 6, 0.50);
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease, background .24s ease;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 16px 42px rgba(0,0,0,0.34),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -1px 0 rgba(216,178,122,0.10);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .luxury-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, transparent 0%, rgba(240,209,160,0.22) 48%, transparent 100%);
            transform: translateX(-120%);
            transition: transform .7s ease;
            pointer-events: none;
        }

        .luxury-btn:hover::before {
            transform: translateX(110%);
        }

        .luxury-btn:active {
            transform: scale(0.982);
            border-color: rgba(240,209,160,0.70);
            background:
                linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.055)),
                rgba(15,12,9,0.66);
            box-shadow:
                0 0 24px rgba(216,178,122,0.18),
                0 8px 26px rgba(0,0,0,0.36),
                inset 0 1px 0 rgba(255,255,255,0.14);
        }

        .luxury-btn .btn-label {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            z-index: 1;
        }

        .luxury-btn .btn-label strong {
            font-family: 'Playfair Display', serif;
            font-size: 23px;
            font-weight: 500;
            letter-spacing: 0.2px;
            line-height: 1.05;
            text-transform: none;
        }

        .luxury-btn .btn-label span {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            color: rgba(247,242,234,0.56);
            text-transform: uppercase;
            letter-spacing: 2.1px;
            font-weight: 600;
            margin-top: 5px;
        }

        .luxury-btn .btn-icon {
            font-size: 19px;
            color: var(--primary);
            opacity: 0.98;
            text-shadow: 0 0 16px rgba(216,178,122,0.36);
            position: relative;
            z-index: 1;
        }

        .gold-btn {
            border-color: rgba(240, 209, 160, 0.72) !important;
            background:
                linear-gradient(135deg, rgba(240,209,160,0.34), rgba(184,138,78,0.16)),
                rgba(18,14,10,0.62) !important;
            box-shadow:
                0 0 0 1px rgba(240,209,160,0.10),
                0 0 22px rgba(216,178,122,0.32),
                0 14px 36px rgba(0,0,0,0.36),
                inset 0 1px 0 rgba(255,255,255,0.16) !important;
        }

        .gold-btn .btn-icon,
        .gold-btn .btn-label strong {
            color: #ffe3ad;
            text-shadow: 0 0 16px rgba(240,209,160,0.48);
        }

        .search-container {
            margin: 18px 0 18px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 18px 15px 48px;
            border-radius: var(--pill);
            border: 1px solid var(--border);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03)),
                rgba(20,18,16,0.82);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .search-input::placeholder {
            color: rgba(247,242,234,0.42);
            letter-spacing: 0.8px;
        }

        .search-input:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 4px rgba(216,178,122,0.08), var(--shadow-soft);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 15px;
            pointer-events: none;
            opacity: 0.95;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .category-card {
            min-height: 138px;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.72)),
                rgba(24,22,20,0.88);
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(240,209,160,0.26);
            border-radius: 26px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease, filter .25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            box-shadow:
                0 18px 45px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .category-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.72)),
                radial-gradient(circle at 50% 0%, rgba(216,178,122,0.18), transparent 52%);
            pointer-events: none;
        }

        .category-card:active {
            transform: scale(0.972);
            border-color: rgba(240,209,160,0.66);
            box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 22px rgba(216,178,122,0.16);
        }

        .category-icon {
            display: none;
        }

        .category-name {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            letter-spacing: 0.4px;
            font-size: 20px;
            color: var(--text);
            line-height: 1.15;
            text-transform: none;
            text-shadow: 0 3px 14px rgba(0,0,0,0.82);
            position: relative;
            z-index: 1;
        }

        #searchResults {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
                rgba(18,16,14,0.72);
            border: 1px solid rgba(216,178,122,0.10);
            border-radius: var(--radius);
            padding: 10px 12px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .food-item {
            display: grid;
            grid-template-columns: 58px 1fr auto;
            align-items: center;
            gap: 13px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            letter-spacing: 0.2px;
        }

        .food-item:last-child {
            border-bottom: none;
        }

        .food-item .item-name {
            font-family: 'DM Sans', sans-serif;
            font-weight: 400;
            font-size: 15px;
            color: var(--text-soft);
            line-height: 1.35;
            flex: 1;
        }

        .item-photo {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            border: 1px solid rgba(216,178,122,0.18);
            background:
                linear-gradient(135deg, rgba(216,178,122,0.18), rgba(255,255,255,0.03)),
                rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(216,178,122,0.88);
            font-size: 22px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 8px 18px rgba(0,0,0,0.22);
            overflow: hidden;
            flex-shrink: 0;
        }

        .food-item .item-price {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: var(--primary);
            font-size: 20px;
            white-space: nowrap;
            letter-spacing: 0.1px;
        }

        .back-fixed {
            position: sticky;
            top: 14px;
            left: auto;
            transform: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 16px 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.11), rgba(255,255,255,0.035)),
                rgba(12,10,8,0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(240,209,160,0.34);
            color: var(--primary);
            padding: 11px 18px;
            border-radius: var(--pill);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition), color var(--transition);
            z-index: 50;
            box-shadow: 0 12px 28px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .back-fixed:active {
            transform: scale(0.97);
            border-color: rgba(216,178,122,0.52);
            color: #fff;
        }

        .footer-note {
            text-align: center;
            margin-top: 46px;
            padding-bottom: 10px;
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 2px;
            line-height: 1.7;
        }

        .footer-note strong {
            color: rgba(240, 209, 160, 0.92);
            font-weight: 700;
        }

        .menu-title {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin: 10px 0 2px;
            font-size: 40px;
            letter-spacing: 0.4px;
            font-weight: 500;
            text-transform: none;
        }

        .menu-subtitle {
            font-family: 'DM Sans', sans-serif;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 10px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        @media (max-width: 420px) {
            .back-fixed {
                top: 10px;
                margin-bottom: 12px;
                padding: 10px 16px;
                font-size: 12px;
            }

            .app-container {
                padding: 14px 12px 110px;
            }

            .category-grid {
                gap: 10px;
            }

            .luxury-btn {
                padding: 16px 16px;
            }

            .luxury-btn .btn-label strong {
                font-size: 17px;
            }
        }

        @media (max-width: 380px) {
            .category-grid {
                grid-template-columns: 1fr;
            }

            .hero-title {
                font-size: 28px;
                letter-spacing: 1.5px;
            }
        }
    
        /* ===== FINALNI SIGURNI PREMIUM FONT FIX =====
           Ovo je namerno na kraju da pregazi sve prethodne greške u fontovima
           i da ne dira bazu menija ni JavaScript. */

        body,
        button,
        input,
        .food-item .item-name,
        .luxury-btn .btn-label span,
        .hero-subtitle,
        .menu-subtitle,
        .footer-note {
            font-family: Georgia, 'Times New Roman', serif !important;
        }

        .hero-title,
        .menu-title,
        h1,
        h2,
        h3,
        .category-name,
        .luxury-btn .btn-label strong,
        .food-item .item-price {
            font-family: Georgia, 'Times New Roman', serif !important;
            font-weight: 500 !important;
            letter-spacing: 0.4px !important;
            text-transform: none !important;
        }

        .hero-title {
            font-size: clamp(42px, 8vw, 62px) !important;
            line-height: 0.95 !important;
        }

        .luxury-btn {
            border-radius: 22px !important;
            border: 1px solid rgba(216, 178, 122, 0.32) !important;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.035)),
                rgba(12, 10, 8, 0.56) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
        }

        .gold-btn {
            border-color: rgba(240, 209, 160, 0.78) !important;
            box-shadow:
                0 0 24px rgba(216,178,122,0.34),
                0 14px 36px rgba(0,0,0,0.36),
                inset 0 1px 0 rgba(255,255,255,0.16) !important;
        }

        .back-fixed {
            position: sticky !important;
            top: 12px !important;
            left: auto !important;
            bottom: auto !important;
            transform: none !important;
            margin-bottom: 14px !important;
        }
    
        /* ===== KLIK NA JELO / PREMIUM MODAL ===== */
        .food-item-btn {
            width: 100%;
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            border-radius: 16px;
            transition: 0.25s ease;
            color: inherit;
        }

        .food-item-btn:hover {
            background: rgba(255,255,255,0.035);
        }

        .food-item-btn:active {
            transform: scale(0.99);
            background: rgba(255,255,255,0.055);
        }

        .food-item-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .food-item-hint {
            font-size: 9px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(247,242,234,0.45);
            font-family: 'DM Sans', sans-serif;
        }

        .item-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.74);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 18px;
        }

        .item-modal.show {
            display: flex;
        }

        .item-modal-card {
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow-y: auto;
            background:
                linear-gradient(180deg, rgba(42,34,26,0.98), rgba(16,13,10,0.98));
            border: 1px solid rgba(216,178,122,0.34);
            border-radius: 26px;
            box-shadow: 0 26px 70px rgba(0,0,0,0.68);
            position: relative;
            padding: 18px;
        }

        .item-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(216,178,122,0.35);
            background: rgba(0,0,0,0.42);
            color: var(--text);
            font-size: 24px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .item-modal-image-wrap {
            width: 100%;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(216,178,122,0.20);
            margin-bottom: 18px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.035), 0 16px 34px rgba(0,0,0,0.34);
        }

        .item-modal-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-modal-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: 'DM Sans', sans-serif;
        }

        .item-modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            line-height: 1.12;
            margin-bottom: 8px;
            color: var(--text);
        }

        .item-modal-price {
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            margin-bottom: 14px;
        }

        .item-modal-desc {
            color: var(--text-soft);
            font-size: 15px;
            line-height: 1.7;
            font-family: 'DM Sans', sans-serif;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appRoot">
        <div id="screenLang" class="screen" style="display: block;">
            <div class="hero-card" style="text-align:center; margin-top:34px;">
                <div class="ornament"><span></span><i>◆</i><span></span></div>
                <h1 class="hero-title">Restoran <span>Koš</span></h1>
                <div class="ornament"><span></span><i>◆</i><span></span></div>

                    card.innerHTML = `<span class="category-name">${cat.names[currentLang] || cat.names.sr}</span>`;

                    grid.appendChild(card);
                });

                if (addToHistory) {
                    history.pushState({ screen: 'screenMenu', category: catId }, '', '#menu-' + catId);

                const items = menuData.filter(item => item.cat === catId);
                const resultsDiv = document.getElementById('searchResults');
                document.getElementById('categoryGrid').style.display = 'none';
                resultsDiv.style.display = 'block';
                const catObj = categories.find(c => c.id === catId);
                const title = (catObj ? catObj.names[currentLang] : catId) || catId;
                let html = `<h3 style="font-family:'Cormorant Garamond',serif; color:var(--primary); margin:8px 0 14px; font-size:26px; letter-spacing:1px;">${title}</h3>`;
                items.forEach(item => {
                    const itemIndex = menuData.indexOf(item);
                    const visual = getItemVisual(item);

                resultsDiv.innerHTML = html;
                
            }

            document.addEventListener('DOMContentLoaded', function() {
                const searchInput = document.getElementById('searchInput');

                    const query = this.value.trim().toLowerCase();
                    const resultsDiv = document.getElementById('searchResults');
                    const grid = document.getElementById('categoryGrid');
                    if (query === '') {
                        grid.style.display = 'grid';
                        resultsDiv.style.display = 'none';
                        return;
                    }
                    grid.style.display = 'none';
                    resultsDiv.style.display = 'block';
                    const filtered = menuData.filter(item => {
                        const originalName = item.name.toLowerCase();
                        const translatedName = getItemName(item).toLowerCase();
                        return originalName.includes(query) || translatedName.includes(query);
                    });

                        resultsDiv.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:40px 12px;">Nema rezultata za "${query}"</p>`;

                    resultsDiv.innerHTML = html;
                });

        /* FINALNI FIX ZA JEZIKE — ne dira meni, samo garantuje da klik radi */
        document.addEventListener('DOMContentLoaded', function () {
            function hideAllScreensFinal() {
                document.querySelectorAll('.screen').forEach(function (screen) {
                    screen.style.display = 'none';
                });
            }

            function showHomeFinal() {
                const home = document.getElementById('screenHome');
                if (!home) return;
                hideAllScreensFinal();
                home.style.display = 'block';
                window.scrollTo(0, 0);
                try {
                    history.pushState({ screen: 'screenHome' }, '', '#home');
                } catch (e) {}
            }

            document.querySelectorAll('#screenLang button').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const lang = btn.getAttribute('data-lang') ||
                        (btn.getAttribute('onclick') || '').match(/setLang\('([^']+)'\)/)?.[1] ||
                        'sr';

                    if (typeof window.setLang === 'function') {
                        try {
                            window.setLang(lang);
                            const home = document.getElementById('screenHome');
                            if (home && home.style.display !== 'block') {
                                showHomeFinal();
                            }
                            return;
                        } catch (err) {
                            showHomeFinal();
                            return;
                        }
                    }

                    showHomeFinal();
                }, true);
            });
        });
    </script>
