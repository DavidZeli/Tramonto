 <!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kafana Stari Koš - Premium Menu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(197, 160, 89, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--dark); 
            color: #fff; 
            font-family: 'Montserrat', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-attachment: fixed;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; }
        .screen { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .logo-area { text-align: center; padding: 40px 0; }
        .logo-area h1 { font-family: 'Playfair Display', serif; font-size: 45px; color: var(--gold); letter-spacing: -1px; }
        .logo-area p { text-transform: uppercase; letter-spacing: 5px; font-size: 10px; color: #888; }

        /* Dugmad glavna */
        .btn {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 20px; border-radius: 15px;
            width: 100%; color: #fff; display: flex; align-items: center; margin-bottom: 12px;
            cursor: pointer; transition: 0.3s; text-decoration: none;
        }
        .btn:active { background: rgba(197, 160, 89, 0.2); }
        .btn i { font-size: 20px; margin-right: 15px; color: var(--gold); }
        .btn-txt b { display: block; font-size: 16px; font-weight: 600; }
        .btn-txt span { font-size: 10px; color: #aaa; text-transform: uppercase; }

        /* Stavke menija */
        .item-row { 
            display: flex; justify-content: space-between; padding: 12px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .item-info h4 { font-size: 14px; font-weight: 400; margin-bottom: 2px; color: #eee; }
        .item-info p { font-size: 11px; color: #777; }
        .item-price { color: var(--gold); font-weight: 600; font-size: 14px; }

        .cat-title { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--gold); text-align: center; margin-bottom: 25px; }

        .back-fixed {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #000; padding: 12px 35px; border-radius: 50px;
            font-weight: 700; font-size: 12px; text-transform: uppercase; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .lang-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="scr-lang" class="screen" style="display: block;">
        <div class="logo-area"><h1>Stari Koš</h1><p>Kraljevo</p></div>
        <div class="lang-grid">
            <button class="btn" onclick="setL('sr')"><i style="font-style:normal">🇷🇸</i><div class="btn-txt"><b>Srpski</b><span>Izaberi jezik</span></div></button>
            <button class="btn" onclick="setL('en')"><i style="font-style:normal">🇬🇧</i><div class="btn-txt"><b>English</b><span>Choose language</span></div></button>
            <button class="btn" onclick="setL('ru')"><i style="font-style:normal">🇷🇺</i><div class="btn-txt"><b>Русский</b><span>Выберите язык</span></div></button>
        </div>
    </div>

    <div id="scr-home" class="screen">
        <div class="logo-area"><h1>Stari Koš</h1><p id="h-sub"></p></div>
        <button class="btn" onclick="showCats()"><i>🍴</i><div class="btn-txt"><b id="m-t">Meni</b><span id="m-s">Hrana i Piće</span></div></button>
        <button class="btn" onclick="window.location.href='tel:+381365101414'"><i>📞</i><div class="btn-txt"><b id="r-t">Rezervacije</b><span id="r-s">036 5101414</span></div></button>
        <button class="btn" onclick="window.open('https://g.page/r/YOUR_GOOGLE_ID/review','_blank')"><i>⭐</i><div class="btn-txt"><b id="g-t">Oceni nas</b><span id="g-s">Google Maps</span></div></button>
        <button class="back-fixed" onclick="goL()" id="b-l">Jezik</button>
    </div>

    <div id="scr-cats" class="screen">
        <h2 class="cat-title" id="c-title">Meni</h2>
        <div id="cats-box"></div>
        <button class="back-fixed" onclick="goH()" id="b-h">Nazad</button>
    </div>

    <div id="scr-items" class="screen">
        <h2 class="cat-title" id="i-title"></h2>
        <div id="items-box"></div>
        <button class="back-fixed" onclick="showCats()" id="b-c">Meni</button>
    </div>
</div>

<script>
let lang = 'sr';
const ui = {
    sr: { h: "Tradicija ukusa", m: "Meni", ms: "Hrana i Piće", r: "Rezervacije", g: "Oceni nas", bl: "Jezik", bh: "Nazad" },
    en: { h: "Tradition of Taste", m: "Menu", ms: "Food & Drinks", r: "Reservations", g: "Review us", bl: "Language", bh: "Back" },
    ru: { h: "Традиция вкуса", m: "Меню", ms: "Еда и напитки", r: "Бронирование", g: "Оцените нас", bl: "Язык", bh: "Назад" }
};

const data = {
    kafe: { t: {sr:"Kafe", en:"Coffee", ru:"Кофе"}, items: [
        {n:"Espresso kafa", p:"190"}, {n:"Espresso sa šlagom", p:"230"}, {n:"Espresso sa mlekom", p:"210"}, {n:"Kapućino", p:"210"}, {n:"Late macchiato", p:"230"}, {n:"Domaća kafa", p:"140"}, {n:"Domaća sa mlekom", p:"170"}
    ]},
    napici: { t: {sr:"Topli i hladni napici", en:"Drinks", ru:"Напитки"}, items: [
        {n:"Kakao", p:"190"}, {n:"Nesquik", p:"220"}, {n:"Topla čokolada gusta", p:"290"}, {n:"Kuvano vino", p:"290"}, {n:"Plazma šejk", p:"350"}
    ]},
    bezalkoholna: { t: {sr:"Sokovi i Vode", en:"Soft Drinks", ru:"Соки и Вода"}, items: [
        {n:"Coca Cola / Zero 0.25", p:"260"}, {n:"Schweppes Bitter/Tonic", p:"330/320"}, {n:"Next (svi ukusi) 0.2", p:"260"}, {n:"Cedevita 0.2", p:"220"}, {n:"Limunada 0.4", p:"230"}, {n:"Ceđeni mix 0.2", p:"410"}, {n:"Rosa 0.33/0.75", p:"160/320"}
    ]},
    dorucak: { t: {sr:"Doručak", en:"Breakfast", ru:"Завтрак"}, items: [
        {n:"Jaje na oko 3 kom", p:"200"}, {n:"Omlet po izboru", p:"200"}, {n:"Jaja sa kobasicom i kačkavaljem", p:"450"}, {n:"Prženice Koš punjene 4 kom", p:"650"}, {n:"Kačamak (sir i kajmak) 300g", p:"300"}, {n:"Koš doručak za dvoje", p:"1650"}
    ]},
    rostilj: { t: {sr:"Roštilj", en:"Grill", ru:"Гриль"}, items: [
        {n:"Ćevapi 5 kom / 10 kom", p:"650/1050"}, {n:"Ćevapi na kajmaku 400g", p:"1250"}, {n:"Punjeni ćevap 400g", p:"1350"}, {n:"Pljeskavica 350g", p:"1050"}, {n:"Gurmanska pljeskavica", p:"1150"}, {n:"Dimljena vešalica 350g", p:"1320"}, {n:"Mešano meso 1.2kg", p:"2900"}
    ]},
    daske: { t: {sr:"Daske", en:"Platters", ru:"Доски"}, items: [
        {n:"Daska Koš", p:"1700"}, {n:"Daska uz pivo", p:"2100"}, {n:"Daska uz vino", p:"1210"}, {n:"Pohovana daska", p:"1650"}
    ]},
    alkohol: { t: {sr:"Rakije i Žestina", en:"Spirits", ru:"Алкоголь"}, items: [
        {n:"Dremina Šljiva/Dunja 0.03", p:"260/290"}, {n:"Kraljevski Božur 0.03", p:"220"}, {n:"Gorki list 0.03", p:"220"}, {n:"Chivas Regal 12yo", p:"470"}, {n:"Jack Daniel's", p:"420"}
    ]}
};

function setL(l) {
    lang = l;
    document.getElementById('h-sub').innerText = ui[l].h;
    document.getElementById('m-t').innerText = ui[l].m;
    document.getElementById('m-s').innerText = ui[l].ms;
    document.getElementById('r-t').innerText = ui[l].r;
    document.getElementById('g-t').innerText = ui[l].g;
    document.getElementById('b-l').innerText = ui[l].bl;
    document.getElementById('b-h').innerText = ui[l].bh;
    goH();
}

function showCats() {
    hS(); const b = document.getElementById('cats-box'); b.innerHTML = '';
    for(let k in data) {
        b.innerHTML += `<button class="btn" onclick="showI('${k}')"><i>→</i><div class="btn-txt"><b>${data[k].t[lang]}</b><span>Vidi ponudu</span></div></button>`;
    }
    document.getElementById('scr-cats').style.display = 'block';
}

function showI(k) {
    hS(); document.getElementById('i-title').innerText = data[k].t[lang];
    const b = document.getElementById('items-box'); b.innerHTML = '';
    data[k].items.forEach(i => {
        b.innerHTML += `<div class="item-row"><div class="item-info"><h4>${i.n}</h4></div><div class="item-price">${i.p} RSD</div></div>`;
    });
    document.getElementById('scr-items').style.display = 'block';
}

function goH() { hS(); document.getElementById('scr-home').style.display = 'block'; }
function goL() { hS(); document.getElementById('scr-lang').style.display = 'block'; }
function hS() { document.querySelectorAll('.screen').forEach(s => s.style.display='none'); window.scrollTo(0,0); }
</script>
</body>
</html>
