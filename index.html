<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">

<!-- ✅ FIX ZA TELEFON (QR ZOOM) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Meni</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.screen{
    width:360px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

/* 🔥 BUTTON - JELLY + LIQUID */
button{
    position: relative;
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:20px;
    background:linear-gradient(135deg,#60a5fa,#3b82f6);
    color:white;
    font-weight:bold;
    cursor:pointer;
    overflow:hidden;
    transition:transform 0.2s;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

button:hover{
    animation:jelly 0.6s ease;
}

button:active{
    transform:scale(0.9);
}

button::before{
    content:"";
    position:absolute;
    top:-100%;
    left:-50%;
    width:200%;
    height:300%;
    background:rgba(255,255,255,0.2);
    transform:rotate(25deg);
    transition:0.5s;
}

button:hover::before{
    top:100%;
}

@keyframes jelly{
    0%{transform:scale(1,1);}
    25%{transform:scale(1.2,0.8);}
    50%{transform:scale(0.9,1.1);}
    75%{transform:scale(1.05,0.95);}
    100%{transform:scale(1,1);}
}

h2{
    margin-top:0;
    text-transform:uppercase;
}

/* ITEM */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.left{
    display:flex;
    align-items:center;
    gap:10px;
}

.item img{
    width:35px;
    height:35px;
    border-radius:8px;
    object-fit:cover;
}

.price{
    font-weight:bold;
}

/* FOOTER */
.footer{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:gray;
    text-align:center;
}
</style>
</head>

<body>

<!-- JEZIK -->
<div id="lang" class="screen">
    <h2>Izaberi jezik</h2>
    <button onclick="openHome()">🇷🇸 Srpski</button>
    <button onclick="openHome()">🇬🇧 English</button>
</div>

<!-- HOME -->
<div id="home" class="screen" style="display:none;">
    <h2>Dobrodošli</h2>

    <button onclick="openMenu()">📋 Meni</button>
    <button onclick="alert('Konobar pozvan')">🧑‍🍳 Konobar</button>
    <button onclick="alert('Rezervacija stola')">🪑 Rezervacija</button>
    <button onclick="alert('Knjiga utisaka')">📖 Knjiga utisaka</button>

    <button onclick="backLang()">Nazad</button>
</div>

<!-- MENI -->
<div id="menu" class="screen" style="display:none;">
    <h2>Meni</h2>

    <button onclick="openCat('doručak')">Doručak</button>
    <button onclick="openCat('obrok salate')">Obrok salate</button>
    <button onclick="openCat('glavna jela')">Glavna jela</button>
    <button onclick="openCat('paste')">Paste</button>
    <button onclick="openCat('variva')">Variva</button>
    <button onclick="openCat('dodaci')">Dodaci</button>
    <button onclick="openCat('salate')">Salate</button>
    <button onclick="openCat('pića')">Pića</button>

    <button onclick="backHome()">Nazad</button>
</div>

<!-- KATEGORIJA -->
<div id="cat" class="screen" style="display:none;">
    <h2 id="title"></h2>
    <div id="list"></div>
    <button onclick="backMenu()">Nazad</button>
</div>

<!-- FOOTER -->
<div class="footer">
    📧 zeli.dvd@gmail.com | 📷 smart_menu_hub
</div>

<script>

function openHome(){
    document.getElementById("lang").style.display="none";
    document.getElementById("home").style.display="block";
}

function backLang(){
    resetAll();
    document.getElementById("lang").style.display="block";
}

function openMenu(){
    resetAll();
    document.getElementById("menu").style.display="block";
}

function backHome(){
    resetAll();
    document.getElementById("home").style.display="block";
}

function backMenu(){
    resetAll();
    document.getElementById("menu").style.display="block";
}

function resetAll(){
    document.getElementById("lang").style.display="none";
    document.getElementById("home").style.display="none";
    document.getElementById("menu").style.display="none";
    document.getElementById("cat").style.display="none";
}

/* SLIKA */
const img = "https://upload.wikimedia.org/wikipedia/commons/1/1b/Coca-Cola_logo.svg";

/* MENI (OSTAJE IDENTIČAN) */
const data = {
"doručak":[
["Srpski doručak","2 jaja, pečenica, kajmak","580"],
["Omlet natur","3 jaja, sir","330"],
["Omlet sa šunkom","šunka, jaja","380"],
["Omlet sa pančetom","pančeta, jaja","400"],
["Jaja na oko","3 jaja","330"],
["Bekendeks","slanina, jaja","400"],
["Mazalice","slanina, jaja","490"]
],
"obrok salate":[
["Ćuretina u salati","ćuretina","1150"],
["Rukola salata","rukola","700"],
["Bella donna","mix","940"]
],
"glavna jela":[
["Pljeskavica","junetina","1120"],
["Pileći file 4 sira","piletina","1170"],
["Meksička piletina","piletina","1130"]
],
"paste":[
["Carbonara","pasta","950"],
["Lazanja","ragu","1050"]
],
"variva":[
["Pirinač","220"],
["Pomfrit","350"]
],
"dodaci":[
["Fokačo","220"],
["Lepinja","80"]
],
"salate":[
["Grčka","450"],
["Šopska","350"]
],
"pića":[
["Pepsi","220"],
["Voda","150"],
["Rakija","200"]
]
};

function openCat(cat){
    resetAll();
    document.getElementById("cat").style.display="block";
    document.getElementById("title").innerText = cat;

    let html="";

    data[cat].forEach(i=>{
        html+=`
        <div class="item">
            <div class="left">
                <img src="${img}">
                <div>
                    <b>${i[0]}</b><br>
                    <small>${i[1] || ""}</small>
                </div>
            </div>
            <div class="price">${i[2]} RSD</div>
        </div>
        `;
    });

    document.getElementById("list").innerHTML = html;
}

</script>

</body>
</html>
